<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>کارت ویزیت من</title>
  <style>
    body {
      margin: 0;
      font-family: tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: url('') no-repeat center center/cover;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
      width: 320px;
      backdrop-filter: blur(5px);
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 15px;
      border: 4px solid #e1306c; /* رنگ شبیه استوری اینستاگرام */
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card h2 {
      margin: 10px 0 5px;
    }

    .card p {
      margin: 5px 0 15px;
      color: #555;
    }

    .links a {
      margin: 0 8px;
      text-decoration: none;
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .telegram { background: #0088cc; }
    .instagram { background: #e1306c; }

    .links a:hover {
      opacity: 0.8;
    }

    img.qr {
      margin: 15px 0;
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="profile-pic">
      <img src="images.jpeg" alt="Profile Picture">
    </div>
    <h2>سپیده پورنامداریان</h2>
    <p>روان شناس کودک</p>
    
    <!-- QR Code -->
    <!img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://t.me/username" alt="QR Code">
    <img class="qr" src="qrcode.png" alt="QR Code">
    <div class="links">
      <a href="https://t.me/username" class="telegram" target="_blank">Telegram</a>
      <a href="https://https://instagram.com/sepide_pournamdarian" class="instagram" target="_blank">Instagram</a>
    </div>
  </div>
</body>
</html>
